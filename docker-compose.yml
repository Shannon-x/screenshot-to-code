version: '3.9'

services:
  # 移除内部Redis服务，使用外部Redis
  # redis服务已注释掉，因为使用外部1Panel-redis-Khtj

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    
    env_file:
      - .env
    
    environment:
      # 配置外部Redis连接
      - REDIS_URL=redis://:redis_5Gk3ZM@1Panel-redis-Khtj:6379
      - BACKEND_PORT=${BACKEND_PORT:-7001}
    
    # 内部暴露端口给其他容器
    expose:
      - "${BACKEND_PORT:-7001}"
    
    # 设置容器内的服务器监听所有接口
    command: poetry run uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-7001}
    
    # 添加网络 - 使用1panel-network以访问外部Redis
    networks:
      - app-network
      - 1panel-network
    
    # 移除对内部redis的依赖

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    # 内部暴露端口给nginx容器
    expose:
      - "5173"
    
    # 设置环境变量，指向backend服务名（容器内部通信）
    environment:
      - VITE_WS_BACKEND_URL=ws://backend:${BACKEND_PORT:-7001}
      - VITE_HTTP_BACKEND_URL=http://backend:${BACKEND_PORT:-7001}
      - VITE_IS_DEPLOYED=false
    
    # 依赖后端服务
    depends_on:
      - backend
    
    # 添加网络
    networks:
      - app-network

  # nginx反向代理容器（使用自定义端口）
  nginx:
    image: nginx:alpine
    ports:
      - "18080:80"      # HTTP端口映射到18080
      - "18443:443"     # HTTPS端口映射到18443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 如果有SSL证书，挂载证书文件
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

# 定义网络
networks:
  app-network:
    driver: bridge
  # 使用外部的1panel-network网络
  1panel-network:
    external: true

# 移除redis-data卷，因为使用外部Redis